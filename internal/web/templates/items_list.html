{{template "base" .}}
{{define "title"}}Items{{end}}
{{define "content"}}
<div class="panel">
  <div class="panel-head">Item Search</div>
  <div class="panel-body">
    <form method="GET" action="/items">
      <input type="text" name="q" value="{{.Query}}" placeholder="Search items…" style="width:300px">
      <button class="btn btn-primary">Search</button>
    </form>
  </div>
</div>
{{if .Results}}
<div class="panel">
  <div class="panel-body">
    <table>
      <tr><th>Owned</th><th>Name</th><th>Description</th><th>Banned</th></tr>
      {{range .Results}}
      <tr>
        <td style="text-align:center">
          <input type="checkbox" {{if .Owned}}checked{{end}}
            onchange="toggleOwned('{{.Slug}}', this.checked)">
        </td>
        <td>{{.Name}}</td>
        <td style="font-size:12px">{{.Description}}</td>
        <td>{{if .IsBanned}}❌{{else}}✓{{end}}</td>
      </tr>
      {{end}}
    </table>
  </div>
</div>
{{end}}
<script>
async function toggleOwned(slug, owned) {
  const params = new URLSearchParams({slug, owned: owned ? '1' : '0'});
  const r = await fetch('/api/items/owned?' + params, {method: 'POST'});
  const j = await r.json().catch(() => ({}));
  if (!r.ok || j.error) {
    alert('Failed to save ownership for ' + slug + ': ' + (j.error || r.statusText));
  }
}
</script>
{{end}}
