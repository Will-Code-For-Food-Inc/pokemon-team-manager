name: Build & Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - goos: linux
            goarch: amd64
          - goos: linux
            goarch: arm64
          - goos: linux
            goarch: arm
            goarm: "7"
          - goos: linux
            goarch: "386"
          - goos: linux
            goarch: riscv64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Build
        env:
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
          GOARM: ${{ matrix.goarm }}
          CGO_ENABLED: 0
        run: |
          SUFFIX=""
          [ -n "${{ matrix.goarm }}" ] && SUFFIX="v${{ matrix.goarm }}"
          OUTPUT="ptm-${{ matrix.goos }}-${{ matrix.goarch }}${SUFFIX}"
          go build -trimpath -ldflags="-s -w -X main.version=${{ github.ref_name }}" \
            -o "dist/${OUTPUT}" ./cmd/ptm/

      - uses: actions/upload-artifact@v4
        with:
          name: ptm-${{ matrix.goos }}-${{ matrix.goarch }}${{ matrix.goarm && format('v{0}', matrix.goarm) || '' }}
          path: dist/
          retention-days: 7

  release:
    name: Release
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist/
          merge-multiple: true

      - name: Checksum
        run: |
          cd dist
          sha256sum ptm-* > sha256sums.txt
          cat sha256sums.txt

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/ptm-*
            dist/sha256sums.txt
          generate_release_notes: true
